<h1>WordPress貼り付け用｜採蜜ブログ</h1>
<ol><li>WordPressで「新規投稿」を開く</li><li>下の①のボタンでタイトルをコピーし、タイトル欄に貼り付け</li>
<li>右上の「︙」→「コードエディター」に切り替え、②のボタンで本文をコピーして貼り付け</li>
<li>「ビジュアルエディター」に戻し、黄色の【写真挿入】5か所を写真に置き換えて「下書き保存」</li></ol>
<div class="box"><b>① タイトル</b><br><textarea id="t" style="height:50px">猛暑を越えた1群が届けてくれた蜂蜜｜「未来の扉」からL&#x27;Atelier de Ashへ、はちみつのバトンリレー</textarea><br>
<button onclick="cp('t','m1')">タイトルをコピー</button><span id="m1" class="ok"></span></div>
<div class="box"><b>② 本文（コードエディターに貼り付け）</b><br><textarea id="b">&lt;!-- wp:paragraph --&gt;
&lt;p&gt;こんにちは。『地元で生まれ地元で育った工務店』ハゼモト建設の櫨本健一です。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;北九州もようやく朝晩が涼しくなり、関門海峡を抜ける風に秋の気配を感じるようになりました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;本日、2026年10月11日、ハゼモト建設で採蜜を行いました。その様子を、スタッフが短い動画に編集してくれています。私があれこれ文章で説明するよりも、まずは動画を見て頂くのが一番だと思いますので、ぜひご覧ください。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;▼採蜜の様子（YouTubeショート）&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:embed {&quot;url&quot;:&quot;https://www.youtube.com/shorts/W_zWlvvC3fQ&quot;,&quot;type&quot;:&quot;video&quot;,&quot;providerNameSlug&quot;:&quot;youtube&quot;,&quot;responsive&quot;:true} --&gt;
&lt;figure class=&quot;wp-block-embed is-type-video is-provider-youtube wp-block-embed-youtube&quot;&gt;&lt;div class=&quot;wp-block-embed__wrapper&quot;&gt;
https://www.youtube.com/shorts/W_zWlvvC3fQ
&lt;/div&gt;&lt;/figure&gt;
&lt;!-- /wp:embed --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;今日は、この蜂蜜がこれからどんな人の手を渡っていくのか、その「バトン」のお話をさせて頂きたいと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;今日の採蜜&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph {&quot;style&quot;:{&quot;color&quot;:{&quot;background&quot;:&quot;#fff3cd&quot;}}} --&gt;
&lt;p class=&quot;has-background&quot; style=&quot;background-color:#fff3cd&quot;&gt;【写真挿入：採蜜当日の様子（蜂蜜の色が分かる寄りのカット）】※この段落を画像ブロックに置き換えてください&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;工務店が蜂蜜を採っている、と聞くと、少し不思議に思われる方もいらっしゃるかもしれません。私自身、家づくりを生業にしてきた人間が、まさか採蜜の日を心待ちにするようになるとは、、、思ってもみませんでした。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;でも、実際に蜂たちと向き合ってみると、これがなかなか奥深いのです。こちらの都合では動いてくれませんし、天気や季節の移ろいにも左右されます。人間がコントロールできることは、本当にわずかなのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;そんな中で迎えた今日の採蜜。出来上がった蜂蜜を見て、まず感じたのは「色がいいな」ということでした。素人の私が言うのもおこがましいのですが、良質な蜂蜜ではないかと思っています。量はこれから量り終えるところですが、これまでの経験からすると、おそらく4kg程度は採れるのではないかと見ています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;はじまりは、OBのお客様からのご縁&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph {&quot;style&quot;:{&quot;color&quot;:{&quot;background&quot;:&quot;#fff3cd&quot;}}} --&gt;
&lt;p class=&quot;has-background&quot; style=&quot;background-color:#fff3cd&quot;&gt;【写真挿入：師匠のOBのお客様と巣箱】※この段落を画像ブロックに置き換えてください&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;そもそも、なぜ工務店が日本ミツバチを飼っているのか。少しだけ、その始まりをお話しさせてください。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;きっかけは、地域とのつながりの中で、たまたま頂いたご縁でした。以前ハゼモト建設で家を建てさせて頂いたOBのお客様から、最初の日本ミツバチを譲り受けたのです。それだけではなく、飼育の方法も一から、しっかりと伝授して頂きました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;家をお引き渡しした後も、こうしてお付き合いが続き、今度は私たちが教わる側になる。家づくりを通じて頂いたご縁が、思いもよらない形で広がっていくことに、ありがたさを感じずにはいられません。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;この夏、3群が1群になりました&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;猛暑による巣落ち&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;実はこの夏まで、巣箱は3群ありました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;ところがこの夏の猛暑の中、そのうちの1群で、巣箱の中の巣が暑さで落ちてしまいました。いわゆる「巣落ち」です。女王蜂以下、その群れは全滅してしまいました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;巣箱の中は、私たちが思う以上に暑さの影響を受けるのだと思います。毎日のように住まいの暑さ対策を考えている人間として、蜂たちの住まいを守り切れなかったことは、本当に残念でなりません、、、&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;スムシの被害&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;もう1群は、スムシという蛾の幼虫に巣を食い荒らされ、壊滅してしまいました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;自然相手のことですから、人間の思い通りにはいきません。それでも、もっとできることはなかったかと、今も考えています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;残った、元気な1群&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph {&quot;style&quot;:{&quot;color&quot;:{&quot;background&quot;:&quot;#fff3cd&quot;}}} --&gt;
&lt;p class=&quot;has-background&quot; style=&quot;background-color:#fff3cd&quot;&gt;【写真挿入：日本ミツバチの巣箱・元気な蜂たち】※この段落を画像ブロックに置き換えてください&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;そうして今、私たちの手元に残っているのは、日本ミツバチの元気な1群だけです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;元気な蜂たちの大活躍&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;予想以上の働きぶり&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;この残った日本ミツバチたちは、もともと元気のいい蜂でした。ただ、正直に申し上げると、仲間の群れを失った夏を越えて、ここまで頑張ってくれるとは思っていなかったのです。予想以上の大活躍でした。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;多くの方が携わる中で、この蜂たちはものすごくいい仕事をしてくれています。日本ミツバチは、巣から半径2キロほどの範囲から蜜を集めてくると言われています。雨の日も風の日も、暑い日も、小さな体で毎日毎日、花と巣を行き来して、少しずつ蜜を集めてくれる。その積み重ねが、今日の蜂蜜になっているのだと思うと、頭が下がる想いです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;蜂に教わること&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;蜂の仕事ぶりを見ていると、一匹一匹は小さな存在でも、それぞれが自分の役割をまじめに果たすことで、大きな成果が生まれるのだと感じます。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;これは私たちの仕事にも、そのまま当てはまるのではないかと考えています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;雨の日も風の日も、暑い時も、一生懸命に働く日本ミツバチを見ていると、私も本当に頑張らないといけないな、と思わされます。小さな蜂に背中を押される日々に、感謝です。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;「未来の扉」へのバトン（濾過・清掃）&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph {&quot;style&quot;:{&quot;color&quot;:{&quot;background&quot;:&quot;#fff3cd&quot;}}} --&gt;
&lt;p class=&quot;has-background&quot; style=&quot;background-color:#fff3cd&quot;&gt;【写真挿入：濾過・清掃の作業（手元のみ・利用者さんが写らない構図）】※この段落を画像ブロックに置き換えてください&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;採れたての蜂蜜は、そのままではまだ使える形になっていません。ここからが、人の手によるバトンリレーの始まりです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;最初のバトンを受け取ってくれるのが、就労支援B型事業所「未来の扉」の皆さんです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;採った蜂蜜をきれいに濾過し、清掃まで丁寧に行って、次の工程へ渡せる状態に整えてくれます。地味に見えるかもしれませんが、ここを丁寧にやるかどうかで、蜂蜜の仕上がりは大きく変わるのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;利用者の皆さんが、一つ一つの作業に真剣に向き合ってくれている姿には、いつも励まされます。「誰かの役に立っている」という実感が、働く喜びにつながっていく。そんな場所であってほしいと願っています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;L&#x27;Atelier de Ashへのバトン&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;パン屋で使える形に&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph {&quot;style&quot;:{&quot;color&quot;:{&quot;background&quot;:&quot;#fff3cd&quot;}}} --&gt;
&lt;p class=&quot;has-background&quot; style=&quot;background-color:#fff3cd&quot;&gt;【写真挿入：L&#x27;Atelier de Ashの蜂蜜／蜂蜜ピザ】※この段落を画像ブロックに置き換えてください&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;濾過・清掃を経た蜂蜜は、ハゼモト建設が運営するパン屋「L&#x27;Atelier de Ash」へと引き継がれます。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;蜂が集め、私たちが採り、「未来の扉」の皆さんが整え、そしてパン屋で使える形にしていく。どこか一か所だけでは成り立たない、人と人とのつながりがあって初めて、蜂蜜が皆さまの口元へ届くのです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;バトンの流れ&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;簡単にまとめると、こんな流れになります。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:table --&gt;
&lt;figure class=&quot;wp-block-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;走者&lt;/th&gt;&lt;th&gt;担うこと&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;第1走者：蜂たち&lt;/td&gt;&lt;td&gt;花から蜜を集め、巣に蓄える&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;第2走者：ハゼモト建設&lt;/td&gt;&lt;td&gt;採蜜を行う&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;第3走者：就労支援B型事業所「未来の扉」&lt;/td&gt;&lt;td&gt;蜂蜜を濾過し、清掃して、使える形に整える&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;第4走者：L&#x27;Atelier de Ash&lt;/td&gt;&lt;td&gt;蜂蜜を販売し、この蜂蜜を使ったピザなどで皆さまへ届ける&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/figure&gt;
&lt;!-- /wp:table --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;採れた蜂蜜は、L&#x27;Atelier de Ashで販売しています。さらに最近では、私たちの日本ミツバチの蜂蜜を使ったピザも販売しています。蜂が集めた蜜が、人の手を渡って、地域の食卓にまで届いていく。私にとっては、これ以上ない嬉しいバトンの行き先です。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;※はちみつ・はちみつを使った食品は、1歳未満の乳児には与えないでください。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;越冬と春への期待&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;今回、蜂蜜をすべて採ってしまったわけではありません。冬を越すための蜂も、蜂蜜も、きちんと残しています。残った1群だからこそ、なおさら大切に冬を越させてあげたいのです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;蜂たちにとっては、これからが試練の季節です。北九州の冬は、関門の冷たい風が吹き付けますので、無事に春を迎えてくれることを願うばかりです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;うまく越冬してくれれば、また春先に採蜜ができるのではないかと思っています。人間の都合で採れるだけ採るのではなく、次の季節へつなぐ分を残しておく。これも一つのバトンなのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;家づくりと通じるもの&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;人の手とご縁&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;採蜜からパン屋までの流れを見ていて、つくづく家づくりと似ているなと感じました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;家づくりも、設計する人、基礎をつくる人、木を組む人、仕上げる人、、、と、たくさんの人の手を渡って一軒の家が出来上がります。どこか一つでも手を抜けば、良い家にはなりません。一人一人が自分の持ち場をまじめに務め、次の人へ丁寧にバトンを渡す。蜂蜜も家も、そうやって生まれるのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;そして、そのバトンをつないでくれるのは、結局のところ「人へのご縁」に他なりません。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;地元の花から採れる「本物」&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;日本ミツバチの蜂蜜は、巣のまわり半径2キロほどに咲く、地元の花々から生まれます。どこか遠くから運ばれてきたものではなく、この土地の季節と自然が、そのまま詰まっているのです。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;私は、この「地元のものを、ごまかさずに、まっすぐ届ける」という姿勢こそ、ハゼモト建設の家づくりの軸と同じだと考えています。北九州の気候風土を知る地元の工務店として、見えないところまで手を抜かず、本物志向で住まいをつくる。日本ミツバチの蜂蜜は、そんな私たちの想いを、とても分かりやすい形で表してくれているように思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;自然と共に暮らすということ&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;蜂は、まわりの自然が豊かでなければ生きていけません。蜂が元気に飛び回れる環境は、きっと人にとっても心地よい環境なのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;私たちは、北九州の気候風土に合わせた高性能住宅を10年以上つくってきました。夏の日差しや冬の風を上手に受け流し、少ないエネルギーで快適に暮らせる家は、自然と無理なく付き合うための一つの形ではないかと考えています。蜂たちの姿を見ていて、そんなことを改めて思い返しました。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;結び&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;OBのお客様から譲り受けた日本ミツバチを工務店が育て、採った蜂蜜を就労支援B型事業所の皆さんが整え、パン屋で活かす。一見ばらばらに見えるかもしれませんが、私の中では「建築力を通して暮らしを向上させる。仕事を楽しみ携わる方の人生を豊かにし、世界へその輪を広げよう」という想いと、一本の線でつながっています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;3群が1群になった夏を越えて、多くの方が携わる中で、小さな蜂たちがものすごくいい仕事をしてくれました。蜂たちと、関わってくださったすべての皆さんに、心から感謝しています。出会いに感謝です。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;日本ミツバチの飼育は、一度きりの話題ではなく、これからもハゼモト建設が大切に続けていきたい取り組みです。季節ごとの蜂たちの様子も、また折に触れてお伝えしていきたいと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;まずは動画で、元気な蜂たちの様子をのぞいてみませんか。そして、L&#x27;Atelier de Ashにお立ち寄りの際には、このバトンリレーのことを少しだけ思い出して頂けたら嬉しく思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;▼採蜜の様子はこちら&lt;/p&gt;

&lt;!-- wp:heading --&gt;
&lt;h2 class=&quot;wp-block-heading&quot;&gt;よくある質問&lt;/h2&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q1. 採れた蜂蜜はどのように使われるのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 就労支援B型事業所「未来の扉」に濾過・清掃の作業をお願いし、ハゼモト建設が運営するパン屋「L&#x27;Atelier de Ash」で販売しています。最近では、ハゼモト建設の日本ミツバチの蜂蜜を使ったピザも販売しています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q2. なぜ工務店が日本ミツバチを飼っているのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 地域とのつながりの中で、ハゼモト建設で家を建てられたOBのお客様からご縁を頂き、最初の日本ミツバチを譲り受けました。飼育方法もしっかり教えて頂き、今では地域の方々をつなぐ大切な取り組みになっています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q3. 次の採蜜はいつ頃になりますか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 越冬のための蜂も蜂蜜も残していますので、蜂たちが無事に冬を越してくれれば、春先にまた採蜜ができるのではないかと考えています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q4. 巣箱は今いくつあるのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 現在は日本ミツバチの1群です。この夏までは3群ありましたが、1群は猛暑で巣箱の中の巣が落ち（巣落ち）、女王蜂以下全滅してしまいました。もう1群はスムシ（蛾の幼虫）の被害で巣が壊滅しました。今は元気な1群が残っています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q5. どんな蜂を飼っているのですか？ どこから蜜を集めてくるのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 日本ミツバチです。日本ミツバチは、巣から半径2キロほどの範囲から蜜を集めてくると言われています。まわりの花々の恵みが、この蜂蜜に詰まっているのだと思います。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q6. どのくらい採れたのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. これまでの経験からすると、今回はおそらく4kg程度になるのではないかと見ています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;

&lt;!-- wp:heading {&quot;level&quot;:3} --&gt;
&lt;h3 class=&quot;wp-block-heading&quot;&gt;Q7. 冬の間、蜂たちはどうしているのですか？&lt;/h3&gt;
&lt;!-- /wp:heading --&gt;

&lt;!-- wp:paragraph --&gt;
&lt;p&gt;A. 今回の採蜜では、蜂蜜をすべて採らずに、蜂たちが冬を越すための分を残しています。蜂たちには、その蜂蜜を頼りに北九州の冬を乗り越えてもらいたいと願っています。&lt;/p&gt;
&lt;!-- /wp:paragraph --&gt;
